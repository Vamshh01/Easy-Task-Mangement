<app-header></app-header>
<main>

    <ul id="users">

        @for(user of users; track user.id){
        <li> <app-user (select)="onSelectUser($event)" [user]="user" [selected]="user.id == selectedUserId">
            </app-user></li>
        }


    </ul>

    @if(selectedUser){
    <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name" />
    }

    @else{
    <p id="fallback"> select a user to view their tasks</p>
    }


</main>
